<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>狐狸今天吃什么</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Noto+Serif+SC:wght@600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 环境氛围层：柔光 + 纸纹 + 漂浮元素 -->
    <div class="ambient" aria-hidden="true">
        <span class="glow glow-a"></span>
        <span class="glow glow-b"></span>
        <span class="glow glow-c"></span>
    </div>

    <div class="container">
        <header class="header">
            <div class="brand">
                <span class="brand-badge">
                    <img src="./image1/eateat.jpg" class="logo-image" alt="狐狸今天吃什么">
                </span>
                <div class="brand-text">
                    <p class="brand-kicker">HULIA EAT · 狐狸食堂</p>
                    <h1 class="title">狐狸今天吃什么</h1>
                </div>
            </div>
            <p class="subtitle">吃嘛嘛香，顿顿不重样</p>

            <div class="stats">
                <div class="stat-item">
                    <span class="stat-number" id="total-options">0</span>
                    <span class="stat-label">吃饭选项</span>
                </div>
                <span class="stat-divider" aria-hidden="true"></span>
                <div class="stat-item">
                    <span class="stat-number" id="today-count">0</span>
                    <span class="stat-label">今日已选</span>
                </div>
            </div>
        </header>

        <nav class="nav">
            <button id="home-btn" class="nav-btn active">首页</button>
            <button id="manage-btn" class="nav-btn">管理选项</button>
        </nav>

        <main class="main">
            <div class="app-container">
                <!-- 首页 -->
                <div id="start-screen" class="screen active">
                    <div class="hero-content">
                        <div class="hero-media">
                            <img src="./image1/eateat.jpg" class="hero-img" alt="今天吃什么">
                        </div>
                        <h2 class="hero-title">今天，吃点什么好的？</h2>
                        <p class="hero-subtitle">美味无需纠结，一点即中。</p>
                    </div>
                    <button id="start-btn" class="main-btn">开始选择</button>
                </div>

                <!-- 结果 -->
                <div id="result-screen" class="screen">
                    <div id="result-container" class="result-container">
                        <div id="result-content" class="result-content">
                            <span id="emoji" class="emoji">🍽️</span>
                            <h2 id="food-result" class="food-result"></h2>
                        </div>
                    </div>
                    <div class="result-actions">
                        <button id="retry-btn" class="secondary-btn">再抽一次</button>
                        <button id="back-home-btn" class="outline-btn">返回首页</button>
                    </div>
                </div>

                <!-- 管理 -->
                <div id="manage-screen" class="screen">
                    <div class="manage-header">
                        <h2 class="manage-title">管理餐饮选项</h2>
                        <p class="manage-subtitle">添加、修改、删除，所有用户实时共享</p>
                        <div class="token-row">
                            <span id="token-state" class="token-state">未设置管理密钥</span>
                            <button id="token-set-btn" type="button" class="token-btn">设置密钥</button>
                            <button id="token-clear-btn" type="button" class="token-btn token-btn-quiet">清除</button>
                        </div>
                    </div>

                    <div class="add-option-form">
                        <div class="form-group">
                            <label for="food-name">餐饮名称</label>
                            <input type="text" id="food-name" placeholder="例如：川菜、火锅、披萨">
                        </div>
                        <div class="form-group">
                            <label for="food-emoji">Emoji 图标</label>
                            <input type="text" id="food-emoji" placeholder="例如：🌶️、🍲、🍕">
                        </div>
                        <button id="add-btn" class="primary-btn">添加选项</button>
                    </div>

                    <details class="import-panel">
                        <summary class="import-toggle">
                            <span class="import-toggle-text">📋 从必吃榜批量导入</span>
                            <span class="import-caret" aria-hidden="true"></span>
                        </summary>
                        <div class="import-body">
                            <p class="import-hint">打开美团 App 的必吃榜，把名单粘贴到下面。每行一家（也支持逗号、顿号分隔），Emoji 会自动匹配。</p>
                            <textarea id="import-text" class="import-text" rows="6" placeholder="楼外楼&#10;老头儿油爆虾&#10;菊英面店&#10;…"></textarea>
                            <div class="import-actions">
                                <button id="import-sample-btn" type="button" class="ghost-btn">载入杭州示例</button>
                                <span class="import-spacer"></span>
                                <button id="import-append-btn" type="button" class="soft-btn">追加导入</button>
                                <button id="import-replace-btn" type="button" class="solid-btn">替换全部</button>
                            </div>
                        </div>
                    </details>

                    <p id="manage-message" class="manage-message" role="status" aria-live="polite"></p>

                    <div class="options-list">
                        <h3 class="options-title">当前选项列表</h3>
                        <div id="options-container" class="options-container">
                            <!-- 选项列表将通过 JavaScript 动态生成 -->
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>&copy; 2026 狐狸今天吃什么 · 让吃饭变得简单</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
